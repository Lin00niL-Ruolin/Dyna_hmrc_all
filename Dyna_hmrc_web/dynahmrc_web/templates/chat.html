<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DynaHMRC - 多机器人协作对话</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0f0f1a;
            --bg-secondary: #1a1a2e;
            --bg-panel: rgba(255, 255, 255, 0.03);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-primary: #f0f0f5;
            --text-secondary: #8b8b9a;
            --accent-primary: #e94560;
            --accent-secondary: #ff6b6b;
            --success: #00d9ff;
            --warning: #ffd700;
            --error: #ff4444;
            --alice-color: #ff6b9d;
            --bob-color: #4ecdc4;
            --lucy-color: #95e1d3;
            --david-color: #a29bfe;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 100%);
            min-height: 100vh;
            color: var(--text-primary);
            overflow: hidden;
        }

        .app-container {
            display: flex;
            height: 100vh;
            max-width: 1300px;
            margin: 0 auto;
        }

        /* 侧边栏 - 机器人和任务状态 */
        .sidebar {
            width: 420px;
            min-width: 420px;
            background: var(--bg-panel);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            backdrop-filter: blur(10px);
            overflow: hidden;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .sidebar-header h1 {
            font-size: 1.3em;
            background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }

        .sidebar-header .subtitle {
            font-size: 0.8em;
            color: var(--text-secondary);
        }

        /* 阶段指示器 - 水平布局更紧凑 */
        .phase-indicator {
            padding: 15px 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .phase-title {
            font-size: 0.75em;
            color: var(--text-secondary);
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .phase-steps {
            display: flex;
            flex-direction: row;
            gap: 6px;
            justify-content: space-between;
        }

        .phase-step {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            padding: 8px 6px;
            border-radius: 10px;
            transition: all 0.3s;
            opacity: 0.4;
            flex: 1;
            text-align: center;
            background: rgba(255, 255, 255, 0.02);
        }

        .phase-step.active {
            background: rgba(233, 69, 96, 0.15);
            border: 1px solid rgba(233, 69, 96, 0.3);
            opacity: 1;
        }

        .phase-step.completed {
            opacity: 0.9;
            background: rgba(0, 217, 255, 0.1);
        }

        .phase-step.completed .phase-icon {
            background: var(--success);
        }

        .phase-icon {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1em;
            background: var(--bg-secondary);
            transition: all 0.3s;
            border: 2px solid transparent;
        }

        .phase-step.active .phase-icon {
            background: var(--accent-primary);
            border-color: rgba(255, 255, 255, 0.3);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(233, 69, 96, 0.4); }
            50% { box-shadow: 0 0 0 10px rgba(233, 69, 96, 0); }
        }

        .phase-name {
            font-size: 0.65em;
            font-weight: 500;
            line-height: 1.2;
        }

        .phase-step.active .phase-name {
            color: var(--accent-primary);
        }

        /* 机器人状态面板 - 新设计 */
        .robots-panel {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
            flex: 1;
            overflow-y: auto;
            min-height: 200px;
        }

        .panel-title {
            font-size: 0.75em;
            color: var(--text-secondary);
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .panel-title::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border-color);
        }

        /* 机器人网格布局 */
        .robots-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .robot-card {
            background: linear-gradient(145deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.02) 100%);
            border-radius: 16px;
            padding: 16px;
            border: 1px solid var(--border-color);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .robot-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: transparent;
            transition: all 0.3s;
        }

        .robot-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .robot-card.leader {
            border-color: var(--warning);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.15);
        }

        .robot-card.leader::before {
            background: var(--warning);
        }

        .robot-card.leader::after {
            content: '👑 领导者';
            position: absolute;
            top: 8px;
            right: 8px;
            font-size: 0.6em;
            padding: 2px 6px;
            background: var(--warning);
            color: #000;
            border-radius: 4px;
            font-weight: 600;
        }

        .robot-card.thinking {
            border-color: var(--warning);
            animation: thinking-pulse 2s infinite;
        }

        .robot-card.thinking::before {
            background: var(--warning);
        }

        @keyframes thinking-pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(255, 215, 0, 0.2); }
            50% { box-shadow: 0 0 20px 5px rgba(255, 215, 0, 0.1); }
        }

        .robot-card.executing {
            border-color: var(--success);
        }

        .robot-card.executing::before {
            background: var(--success);
        }

        .robot-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }

        .robot-avatar {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5em;
            background: var(--bg-secondary);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            position: relative;
        }

        .robot-avatar.alice { 
            background: linear-gradient(135deg, var(--alice-color), #ff8fab); 
            box-shadow: 0 4px 15px rgba(255, 107, 157, 0.3);
        }
        .robot-avatar.bob { 
            background: linear-gradient(135deg, var(--bob-color), #44a3aa); 
            box-shadow: 0 4px 15px rgba(78, 205, 196, 0.3);
        }
        .robot-avatar.lucy { 
            background: linear-gradient(135deg, var(--lucy-color), #74b9ff); 
            box-shadow: 0 4px 15px rgba(149, 225, 211, 0.3);
        }
        .robot-avatar.david { 
            background: linear-gradient(135deg, var(--david-color), #6c5ce7); 
            box-shadow: 0 4px 15px rgba(162, 155, 254, 0.3);
        }

        .robot-info {
            flex: 1;
            min-width: 0;
        }

        .robot-name {
            font-weight: 700;
            font-size: 1em;
            margin-bottom: 2px;
        }

        .robot-type {
            font-size: 0.7em;
            color: var(--text-secondary);
            white-space: normal;
            overflow: visible;
            line-height: 1.3;
        }

        .robot-status-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .robot-status-badge {
            font-size: 0.65em;
            padding: 4px 10px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.08);
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .robot-status-badge::before {
            content: '';
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: currentColor;
        }

        .robot-status-badge.thinking { 
            background: rgba(255, 215, 0, 0.15); 
            color: var(--warning); 
        }
        .robot-status-badge.executing { 
            background: rgba(0, 217, 255, 0.15); 
            color: var(--success); 
        }
        .robot-status-badge.idle { 
            background: rgba(0, 255, 136, 0.15); 
            color: #00ff88; 
        }

        .robot-capabilities {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-top: 10px;
        }

        .capability-tag {
            font-size: 0.6em;
            padding: 2px 8px;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
        }

        .robot-current-task {
            font-size: 0.75em;
            color: var(--text-secondary);
            padding: 10px 12px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            margin-top: 12px;
            border-left: 3px solid var(--accent-primary);
            line-height: 1.4;
        }

        .robot-current-task:empty {
            display: none;
        }

        /* API Key 输入面板 - 紧凑版 */
        .api-key-panel {
            padding: 15px 20px;
            border-bottom: 1px solid var(--border-color);
            background: rgba(0, 0, 0, 0.2);
        }

        .api-key-input {
            width: 100%;
            padding: 10px 12px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 0.8em;
            margin-bottom: 10px;
            transition: all 0.3s;
        }

        .api-key-input:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(233, 69, 96, 0.1);
        }

        .api-key-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.75em;
            color: var(--text-secondary);
            cursor: pointer;
            margin-top: 12px;
        }

        .api-key-toggle input {
            accent-color: var(--accent-primary);
            width: 16px;
            height: 16px;
        }

        .api-status {
            font-size: 0.7em;
            margin-top: 10px;
            padding: 6px 10px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .api-status.mock {
            background: rgba(255, 215, 0, 0.15);
            color: var(--warning);
        }

        .api-status.kimi {
            background: rgba(0, 217, 255, 0.15);
            color: var(--success);
        }

        /* 演示控制面板 - 紧凑版 */
        .demo-panel {
            padding: 15px 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .demo-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 0.85em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(108, 92, 231, 0.3);
        }

        .demo-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(108, 92, 231, 0.4);
        }

        .demo-btn:disabled {
            background: #555;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
            opacity: 0.7;
        }

        .demo-hint {
            font-size: 0.7em;
            color: var(--text-secondary);
            margin-top: 8px;
            text-align: center;
            opacity: 0.8;
        }

        /* 任务进度面板 - 紧凑版 */
        .task-progress-panel {
            padding: 15px 20px;
            border-bottom: 1px solid var(--border-color);
            background: rgba(0, 0, 0, 0.15);
        }

        .progress-stats {
            display: flex;
            justify-content: space-around;
            margin-bottom: 12px;
        }

        .stat-item {
            text-align: center;
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            min-width: 80px;
        }

        .stat-value {
            font-size: 1.6em;
            font-weight: bold;
            color: var(--accent-primary);
            line-height: 1.2;
        }

        .stat-label {
            font-size: 0.7em;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        .progress-bar-container {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            height: 10px;
            overflow: hidden;
            margin-bottom: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
            border-radius: 10px;
            transition: width 0.5s ease;
            box-shadow: 0 0 10px rgba(233, 69, 96, 0.3);
        }

        .completed-objects {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            max-height: 80px;
            overflow-y: auto;
        }

        .object-tag {
            font-size: 0.7em;
            padding: 4px 10px;
            border-radius: 12px;
            background: rgba(0, 217, 255, 0.15);
            color: var(--success);
            display: flex;
            align-items: center;
            gap: 4px;
            border: 1px solid rgba(0, 217, 255, 0.2);
        }

        .object-tag::before {
            content: '✓';
        }

        /* 主聊天区域 */
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: rgba(0, 0, 0, 0.2);
        }

        /* 聊天头部 */
        .chat-header {
            padding: 15px 25px;
            background: var(--bg-panel);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            backdrop-filter: blur(10px);
        }

        .chat-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .chat-title h2 {
            font-size: 1.1em;
            font-weight: 600;
        }

        .online-status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.8em;
            color: var(--text-secondary);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #00ff88;
            animation: pulse-dot 2s infinite;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* 控制按钮 */
        .chat-controls {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .control-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: var(--text-primary);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85em;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .control-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .control-btn.active {
            background: var(--accent-primary);
        }

        .speed-selector {
            display: flex;
            gap: 5px;
            background: rgba(0, 0, 0, 0.3);
            padding: 4px;
            border-radius: 8px;
        }

        .speed-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8em;
            transition: all 0.3s;
        }

        .speed-btn.active {
            background: var(--accent-primary);
            color: white;
        }

        .filter-dropdown {
            position: relative;
        }

        .filter-menu {
            position: absolute;
            top: 100%;
            right: 0;
            margin-top: 8px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px;
            min-width: 150px;
            display: none;
            z-index: 100;
        }

        .filter-menu.show {
            display: block;
        }

        .filter-option {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85em;
            transition: all 0.2s;
        }

        .filter-option:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .filter-option input {
            accent-color: var(--accent-primary);
        }

        /* 消息区域 */
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 25px;
            scroll-behavior: smooth;
        }

        .messages-container::-webkit-scrollbar {
            width: 6px;
        }

        .messages-container::-webkit-scrollbar-track {
            background: transparent;
        }

        .messages-container::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
        }

        /* 时间分隔线 */
        .time-divider {
            text-align: center;
            margin: 20px 0;
            position: relative;
        }

        .time-divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: var(--border-color);
        }

        .time-divider span {
            background: rgba(26, 26, 46, 0.9);
            padding: 0 15px;
            font-size: 0.75em;
            color: var(--text-secondary);
            position: relative;
        }

        /* 系统消息 */
        .system-message {
            text-align: center;
            margin: 20px 0;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .system-message-content {
            display: inline-block;
            background: rgba(233, 69, 96, 0.15);
            border: 1px solid rgba(233, 69, 96, 0.3);
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 0.85em;
            color: var(--accent-primary);
        }

        /* 消息气泡 */
        .message {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            animation: slideIn 0.4s ease;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .message.own {
            flex-direction: row-reverse;
        }

        .message-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4em;
            flex-shrink: 0;
            position: relative;
        }

        .message-avatar.alice { background: linear-gradient(135deg, var(--alice-color), #ff8fab); }
        .message-avatar.bob { background: linear-gradient(135deg, var(--bob-color), #44a3aa); }
        .message-avatar.lucy { background: linear-gradient(135deg, var(--lucy-color), #74b9ff); }
        .message-avatar.system { background: linear-gradient(135deg, #6c5ce7, #a29bfe); }

        .message-avatar.leader::after {
            content: '👑';
            position: absolute;
            bottom: -2px;
            right: -2px;
            font-size: 0.6em;
            background: var(--bg-primary);
            border-radius: 50%;
            width: 18px;
            height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .message-content {
            max-width: 70%;
        }

        .message-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 5px;
        }

        .message.own .message-header {
            flex-direction: row-reverse;
        }

        .message-author {
            font-size: 0.85em;
            font-weight: 600;
        }

        .message-author.alice { color: var(--alice-color); }
        .message-author.bob { color: var(--bob-color); }
        .message-author.lucy { color: var(--lucy-color); }

        .message-time {
            font-size: 0.7em;
            color: var(--text-secondary);
        }

        .message-bubble {
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 0.9em;
            line-height: 1.5;
            position: relative;
            word-wrap: break-word;
        }

        .message:not(.own) .message-bubble {
            background: var(--bg-panel);
            border-bottom-left-radius: 4px;
        }

        .message.own .message-bubble {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            border-bottom-right-radius: 4px;
        }

        .message-bubble.leader {
            border: 2px solid var(--warning);
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.2);
        }

        .message-bubble.reflection {
            font-style: italic;
            opacity: 0.7;
            background: rgba(100, 100, 100, 0.2);
        }

        .message-text {
            white-space: pre-wrap;
            word-wrap: break-word;
            line-height: 1.5;
        }

        /* 思考中指示器 */
        .thinking-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 14px;
            background: rgba(255, 215, 0, 0.1);
            border-radius: 16px;
            border: 1px solid rgba(255, 215, 0, 0.3);
        }

        .thinking-dots {
            display: flex;
            gap: 4px;
        }

        .thinking-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--warning);
            animation: thinking-bounce 1.4s infinite ease-in-out both;
        }

    <script>
        // ==================== 配置和状态 ====================
        const CONFIG = {
            robots: {
                Alice: { name: 'Alice', type: 'MobileManipulation', avatar: '🚗', color: 'alice', capabilities: ['navigate', 'open', 'pick', 'place', 'move', 'communicate', 'wait'] },
                Bob: { name: 'Bob', type: 'Manipulator', avatar: '🦾', color: 'bob', capabilities: ['pick', 'place', 'communicate', 'wait'] },
                David: { name: 'David', type: 'Mobile', avatar: '🤖', color: 'david', capabilities: ['navigate', 'communicate', 'wait'] },
                Lucy: { name: 'Lucy', type: 'Drone', avatar: '🚁', color: 'lucy', capabilities: ['navigate', 'pick', 'place', 'communicate', 'wait'] }
            },
            phases: ['self-description', 'task-allocation', 'voting', 'execution', 'reflection']
        };

        const state = {
            isPlaying: true,
            playbackSpeed: 1,
            currentPhase: null,
            leader: null,
            messages: [],
            taskProgress: { completed: [], remaining: [] },
            filter: ['Alice', 'Bob', 'David', 'Lucy'],
            messageQueue: [],
            isProcessingQueue: false
        };

        // ==================== DOM 元素 ====================
        const elements = {
            messagesContainer: document.getElementById('messages-container'),
            robotsContainer: document.getElementById('robots-container'),
            completedCount: document.getElementById('completed-count'),
            remainingCount: document.getElementById('remaining-count'),
            progressBar: document.getElementById('task-progress-bar'),
            completedObjects: document.getElementById('completed-objects'),
            playPauseBtn: document.getElementById('play-pause-btn'),
            speedBtns: document.querySelectorAll('.speed-btn'),
            filterBtn: document.getElementById('filter-btn'),
            filterMenu: document.getElementById('filter-menu'),
            chatInput: document.getElementById('chat-input'),
            sendBtn: document.getElementById('send-btn'),
            statusIndicator: document.getElementById('status-indicator'),
            apiKeyInput: document.getElementById('api-key-input'),
            useMockCheckbox: document.getElementById('use-mock'),
            useDefaultKeyBtn: document.getElementById('use-default-key-btn'),
            clearKeyBtn: document.getElementById('clear-key-btn'),
            apiStatus: document.getElementById('api-status'),
            demoBtn: document.getElementById('demo-btn')
        };

        // ==================== 消息队列管理 ====================
        class MessageQueue {
            constructor() {
                this.queue = [];
                this.isProcessing = false;
                this.processingDelay = 1000;
            }

            add(message) {
                this.queue.push(message);
                if (!this.isProcessing) {
                    this.process();
                }
            }

            async process() {
                if (this.isProcessing || this.queue.length === 0) return;
                
                this.isProcessing = true;
                
                while (this.queue.length > 0 && state.isPlaying) {
                    const message = this.queue.shift();
                    await this.displayMessage(message);
                    await this.delay(this.processingDelay / state.playbackSpeed);
                }
                
                this.isProcessing = false;
            }

            async displayMessage(message) {
                // 检查过滤
                if (message.robot_id && !state.filter.includes(message.robot_id)) {
                    return;
                }

                // 根据消息的 phase 字段切换阶段（确保阶段和消息同步）
                if (message.phase && message.phase !== state.currentPhase) {
                    setPhase(message.phase);
                }

                // Show thinking

        // ==================== WebSocket / API 连接 ====================
        async function startTask() {
            const task = elements.chatInput.value.trim();
            if (!task) return;

            elements.sendBtn.disabled = true;
            elements.sendBtn.innerHTML = '<span>⏳</span> 执行中...';

            // Clear message area
            elements.messagesContainer.innerHTML = '';
            state.messages = [];

            // 获取 API 配置
            const apiKey = elements.apiKeyInput.value.trim();
            const useMock = elements.useMockCheckbox.checked;

            // 先初始化 API
            try {
                const initResponse = await fetch('/api/init', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        api_key: apiKey || null,
                        use_mock: useMock
                    })
                });

                const initData = await initResponse.json();
                if (!initData.success) {
                    throw new Error(initData.error || '初始化失败');
                }

                // 更新状态显示
                elements.apiStatus.innerHTML = `<span>✅</span> ${initData.llm_type} 模式`;
            } catch (error) {
                console.error('初始化失败:', error);
                addSystemMessage(`⚠️ 将使用默认配置继续运行`);
            }

            let retryCount = 0;
            const maxRetries = 2;
            let lastPhase = '';
            
            while (retryCount <= maxRetries) {
                try {
                    if (retryCount > 0) {
                        addSystemMessage(`🔄 正在重试第 ${retryCount}/${maxRetries} 次...`);
                    }
                    
                    // 使用 AbortController 设置更长的超时时间（5分钟）
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 300000); // 5分钟超时
                    
                    const response = await fetch('/api/execute/stream', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ task }),
                        signal: controller.signal
                    });
                    
                    clearTimeout(timeoutId);

                    if (!response.ok) {
                        throw new Error(`服务器响应错误: ${response.status} ${response.statusText}`);
                    }

                    const reader = response.body.getReader();
                    const decoder = new TextDecoder();
                    let hasError = false;

                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;

                        const text = decoder.decode(value);
                        const events = text.split('\n\n').filter(e => e.trim());

                        for (const event of events) {
                            const result = parseSSEEvent(event);
                            if (result && result.error) {
                                hasError = true;
                            }
                            if (result && result.phase) {
                                lastPhase = result.phase;
                            }
                        }
                    }
                    
                    // 成功完成，跳出重试循环
                    break;
                    
                } catch (error) {
                    console.error(`[Attempt ${retryCount + 1}] Error:`, error);
                    
                    // 处理 AbortController 的取消错误
                    if (error.name === 'AbortError') {
                        console.log('[INFO] Request was aborted, likely due to timeout');
                    }
                    
                    if (retryCount === maxRetries) {
                        // 最后一次重试也失败了
                        let errorMsg = error.message;
                        if (error.name === 'AbortError' || error.message.includes('network') || error.message.includes('fetch')) {
                            errorMsg = '网络连接中断或请求超时';
                            if (lastPhase) {
                                errorMsg += ` (发生在${getPhaseName(lastPhase)}阶段)`;
                            }
                            errorMsg += '。Kimi API 可能需要较长时间处理，建议增加超时时间或使用 Mock 模式测试。';
                        }
                        addSystemMessage(`❌ 错误: ${errorMsg}`);
                        addSystemMessage(`💡 建议: 请检查网络连接，或尝试使用 Mock 模式测试`);
                    } else {
                        retryCount++;
                        addSystemMessage(`⏳ 第 ${retryCount} 次重试中...`);
                        await new Promise(resolve => setTimeout(resolve, 2000)); // 等待2秒后重试
                    }
                }
            }
            
            elements.sendBtn.disabled = false;
            elements.sendBtn.innerHTML = '<span>🚀</span> 开始任务';
        }

        function getPhaseName(phase) {
            const phaseNames = {
                'self-description': '自我介绍',
                'task-allocation': '任务分配',
                'voting': '投票选举',
                'execution': '执行阶段',
                'reflection': '反思阶段',
                'completed': '完成'
            };
            return phaseNames[phase] || phase;
        }

        function parseSSEEvent(eventText) {
            const lines = eventText.split('\n');
            let event = '';
            let dataLines = [];

            for (const line of lines) {
                if (line.startsWith('event: ')) {
                    event = line.slice(7);
                } else if (line.startsWith('data: ')) {
                    dataLines.push(line.slice(6));
                } else if (line === '') {
                    // 空行，忽略
                } else {
                    // 继续前一行的data
                    dataLines.push(line);
                }
            }

            const data = dataLines.join('\n');
            if (!data) return null;

            try {
                const parsed = JSON.parse(data);
                handleServerEvent(event, parsed);
                
                // 返回阶段信息用于错误追踪
                const result = {};
                if (event === 'phase' && parsed.phase) {
                    result.phase = parsed.phase;
                }
                if (event === 'error') {
                    result.error = true;
                }
                return result;
            } catch (e) {
                console.error('Parse error:', e, 'Data:', data);
                return { error: true };
            }
        }

        function handleServerEvent(event, data) {
            switch (event) {
                case 'start':
                    addTimeDivider(new Date().toLocaleTimeString());
                    addSystemMessage(`🚀 开始任务`);
                    break;

                case 'phase':
                    // 只在消息队列为空时通过 phase 事件切换阶段
                    // 否则阶段切换由消息队列中的消息驱动
                    if (messageQueue.queue.length === 0 && !messageQueue.isProcessing) {
                        setPhase(data.phase);
                    }
                    break;

                case 'thinking':
                    // 处理思考内容
                    break;

                case 'robot_message':
                    messageQueue.add({
                        robot_id: data.robot_id,
                        thought: data.thought,
                        description: data.description,
                        plan: data.plan,
                        campaign: data.campaign,
                        vote_for: data.vote_for,
                        reasoning: data.reasoning,
                        summary: data.summary,
                        future_plan: data.future_plan,
                        updated_plan: data.updated_plan,
                        action: data.action,
                        action_status: data.action_status,
                        feedback_type: data.feedback_type,
                        is_leader: data.is_leader,
                        is_reflection: data.is_reflection,
                        reply_to: data.reply_to,
                        reply_text: data.reply_text,
                        full_prompt: data.full_prompt,
                        full_response: data.full_response,
                        phase: data.phase,  // 包含 phase 字段用于前端驱动阶段切换
                        timestamp: data.timestamp
                    });
                    break;

                case 'task_progress':
                    updateTaskProgress(data.completed_objects, data.remaining_objects);
                    break;

                case 'complete':
                    addSystemMessage(`✅ Task Complete`);
                    break;

                case 'system':
                    addSystemMessage(`${data.message}`);
                    // 如果收到重置领导者信号，清空领导者状态
                    if (data.reset_leader) {
                        state.leader = null;
                        updateLeaderDisplay();
                    }
                    break;

                case 'error':
                    addSystemMessage(`❌ ${data.message}`);
                    break;
            }
        }

            const visibleCount = currentScene.visible_objects.length;
            const hiddenCount = currentScene.hidden_objects.length;
            const furnitureCount = currentScene.furniture.length;
            
            // 统计各区域家具数量
            let kitchenCount = 0, livingRoomCount = 0, bathroomCount = 0;
            currentScene.furniture.forEach(furn => {
                const zone = getFurnitureZone(furn.name);
                if (zone.order === 1) kitchenCount++;
                else if (zone.order === 2) livingRoomCount++;
                else if (zone.order === 3) bathroomCount++;
            });
            
            currentSceneInfo.innerHTML = `
                📍 <strong>${currentScene.description}</strong><br>
                🏠 家具: ${furnitureCount} | 🍳 ${kitchenCount} 🛋️ ${livingRoomCount} 🚿 ${bathroomCount} | 👁️ ${visibleCount} | 📦 ${hiddenCount}

        // 获取家具所属区域
        function getFurnitureZone(name) {
            const kitchenItems = ['kitchen_table', 'refrigerator', 'kitchen_cabinet', 'countertop'];
            const livingRoomItems = ['coffee_table', 'sofa', 'tv_cabinet', 'bookshelf', 'side_table'];
            const bathroomItems = ['washbasin', 'bathroom_cabinet', 'shelf'];
            
            if (kitchenItems.includes(name)) return { name: '🍳 厨房', icon: '🍳', order: 1 };
            if (livingRoomItems.includes(name)) return { name: '🛋️ 客厅', icon: '🛋️', order: 2 };
            if (bathroomItems.includes(name)) return { name: '🚿 浴室', icon: '🚿', order: 3 };
            return { name: '📦 其他', icon: '📦', order: 4 };
        }

                            <div style="font-size: 0.85em; margin-top: 4px;">
                                👁️ 表面物品: ${items}
                                ${hidden ? `<br>${hidden}` : ''}
                            </div>
                        </div>
                    `;
                });
            });
            
            modal.innerHTML = `
                <div class="example-modal-content" style="max-width: 700px; max-height: 80vh; overflow-y: auto;">
                    <div class="example-modal-header">
                        <h3>🏠 ${getSceneDisplayName(scene.name)} - 场景详情</h3>
                        <button class="example-modal-close">&times;</button>
                    </div>
                    <div class="example-modal-body">
                        <p style="color: var(--text-secondary); margin-bottom: 15px;">${scene.description}</p>
                        
                        <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 20px; text-align: center;">
                            <div style="background: rgba(78, 205, 196, 0.1); padding: 10px; border-radius: 8px;">
                                <div style="font-size: 1.5em;">🏠</div>
                                <div style="font-size: 0.9em;">${scene.furniture.length} 个家具</div>
                            </div>
                            <div style="background: rgba(74, 222, 128, 0.1); padding: 10px; border-radius: 8px;">
                                <div style="font-size: 1.5em;">👁️</div>
                                <div style="font-size: 0.9em;">${scene.visible_objects.length} 个可见物品</div>
                            </div>
                            <div style="background: rgba(248, 113, 113, 0.1); padding: 10px; border-radius: 8px;">
                                <div style="font-size: 1.5em;">📦</div>
                                <div style="font-size: 0.9em;">${scene.hidden_objects.length} 个隐藏物品</div>
                            </div>
                            <div style="background: rgba(251, 191, 36, 0.1); padding: 10px; border-radius: 8px;">
                                <div style="font-size: 1.5em;">🚪</div>
                                <div style="font-size: 0.9em;">3 个房间</div>
                            </div>
                        </div>
                        
                        <h4 style="margin-bottom: 10px;">📋 家具列表 (按区域)</h4>
                        ${furnitureHtml}
                    </div>
                </div>
            `;
            
            document.body.appendChild(modal);
            
            modal.querySelector('.example-modal-close').addEventListener('click', () => {
                modal.remove();
            });
            
            modal.addEventListener('click', (e) => {
                if (e.target === modal) modal.remove();
            });
        }

        // 获取家具显示名称
        function getFurnitureDisplayName(name) {
            const names = {
                // 厨房家具
                'kitchen_table': '🍽️ 餐桌',
                'refrigerator': '❄️ 冰箱',
                'kitchen_cabinet': '🗄️ 橱柜',
                'countertop': '🔪 操作台',
                // 客厅家具
                'coffee_table': '☕ 茶几',
                'bookshelf': '📚 书架',
                'sofa': '🛋️ 沙发',
                'tv_cabinet': '📺 电视柜',
                // 浴室家具
                'washbasin': '🚰 洗手台',
                'bathroom_cabinet': '🚪 浴室柜',
                'shelf': '📦 置物架'
            };
            return names[name] || name;
        }

        // ==================== 任务分析功能 ====================
        
        // 分析按钮点击事件
        document.getElementById('analyze-btn').addEventListener('click', async () => {
            const task = elements.chatInput.value.trim();
            if (!task) {
                showNotification('请输入任务指令', 'warning');
                return;
            }
            
            await analyzeTask(task);
        });
        
        // 分析任务函数
        async function analyzeTask(task) {
            const panel = document.getElementById('task-analysis-panel');
            const content = document.getElementById('analysis-content');
            
            // 显示面板并显示加载状态
            panel.style.display = 'block';
            content.innerHTML = '<div class="analysis-loading">正在分析任务复杂度...</div>';
            
            try {
                const response = await fetch('/api/analyze_task', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ task })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    displayAnalysisResult(data);
                } else {
                    content.innerHTML = `<div style="color: var(--error);">分析失败: ${data.error}</div>`;
                }
            } catch (error) {
                content.innerHTML = `<div style="color: var(--error);">分析失败: ${error.message}</div>`;
            }
        }
        
        // 显示分析结果
        function displayAnalysisResult(data) {
            const content = document.getElementById('analysis-content');
            
            const complexityClass = data.complexity === 'simple' ? 'complexity-simple' :
                                   data.complexity === 'moderate' ? 'complexity-moderate' :
                                   data.complexity === 'complex' ? 'complexity-complex' : 'complexity-very';
            
            const collabClass = data.collaboration_needed ? 'collaboration-yes' : 'collaboration-no';
            const collabText = data.collaboration_needed ? '✅ 需要' : '❌ 不需要';
            
            // 任务类型颜色
            const typeColors = {
                'pack_object': '#4ecdc4',
                'sort_solid': '#95e1d3',
                'make_sandwich': '#ff6b9d',
                'unknown': '#9ca3af'
            };
            const typeColor = typeColors[data.task_type] || '#9ca3af';
            
            let html = `
                <p><strong>📋 任务类型:</strong> <span style="color: ${typeColor}; font-weight: 600;">${data.task_type_label}</span></p>
                <p><strong>任务:</strong> ${data.task}</p>
                <p><strong>复杂度:</strong> <span class="${complexityClass}">${data.complexity_label}</span> <span style="color: var(--text-secondary); font-size: 0.9em;">(D=${data.D_value})</span></p>
                <p><strong>多机器人协作:</strong> <span class="${collabClass}">${collabText}</span></p>
            `;

            // DynaHMRC 三因子详情
            if (data.D_value !== undefined) {
                html += `<p style="font-size: 0.85em; color: var(--text-secondary); margin-left: 10px;">`;
                html += `📊 L(位置)=${data.location_factor} | N(数量)=${data.quantity_factor} | Y(协作)=${data.collaboration_factor}`;
                html += `</p>`;
            }

            // 动态复杂度因子
            if (data.dynamic_complexity && data.dynamic_complexity.length > 0) {
                const factorLabels = {
                    'CTO': '目标变更',
                    'IRZ': '禁区引入',
                    'ANC': '新成员加入',
                    'REC': '成员移除'
                };
                const factors = data.dynamic_complexity.map(f => factorLabels[f] || f).join(', ');
                html += `<p style="color: #f87171; font-size: 0.85em;">⚠️ 动态复杂度: ${factors}</p>`;
            }

            if (data.required_capabilities && data.required_capabilities.length > 0) {
                html += `<p><strong>需要能力:</strong> ${data.required_capabilities.join(', ')}</p>`;
            }

            html += `<p><strong>估计步骤:</strong> ${data.estimated_steps} 步</p>`;

            if (data.subtasks && data.subtasks.length > 1) {
                html += `<p><strong>子任务分解:</strong></p><ul class="subtasks">`;
                data.subtasks.slice(0, 5).forEach((subtask, i) => {
                    const typeLabels = {
                        'pick_and_place': '拾取放置',
                        'sort': '分类',
                        'assemble': '组装'
                    };
                    const typeLabel = typeLabels[subtask.type] || subtask.type;
                    html += `<li>${typeLabel}: ${subtask.target}</li>`;
                });
                if (data.subtasks.length > 5) {
                    html += `<li>... 还有 ${data.subtasks.length - 5} 个子任务</li>`;
                }
                html += `</ul>`;
            }

            html += `<p style="margin-top: 10px; color: var(--text-secondary); font-size: 0.85em;"><strong>💡 分析:</strong> ${data.reasoning}</p>`;
            
            content.innerHTML = html;
        }
        
        // Close analysis panel
        document.getElementById('analysis-close').addEventListener('click', () => {
            document.getElementById('task-analysis-panel').style.display = 'none';
        });
        
        // ==================== 示例任务弹窗 ====================
        
        // 三种基础任务类型示例
        const taskExamples = {
            pack_object: {
                name: '📦 装箱任务',
                description: '拾取放置：将物品拾取并放入指定的托盘/容器',
                details: '评估多机器人在拾取放置任务上的协作能力。系统中包含固定机械臂和移动机器人，通过四阶段模型实现自主任务分配与协调。',
                color: '#4ecdc4',
                tasks: [
                    { task: "装箱：Put \"cup\" and \"toothbrush\" into tray.", level: "simple", label: "⭐ 简单" },
                    { task: "装箱：Put \"cup\", \"remote\" and \"tableware\" into tray.", level: "moderate", label: "⭐⭐ 中等" },
                    { task: "装箱：Put \"cup\", \"tableware\", \"toiletry\" and \"book\" into tray.", level: "complex", label: "⭐⭐⭐ 复杂" },
                    { task: "装箱：Put \"cup\", \"tableware\", \"toiletry\", \"book\" and \"fruit\" into tray.", level: "very_complex", label: "⭐⭐⭐⭐ 极复杂" }
                ]
            },
            sort_solid: {
                name: '🎨 分类任务',
                description: '分类：按类别将物品分类并放置到指定区域',
                details: '评估多机器人在分类任务上的协作能力。系统中包含固定机械臂和移动机器人，通过四阶段模型实现自主任务分配与协调。',
                color: '#95e1d3',
                tasks: [
                    { task: "分类：Sort \"tableware\" and \"cup\" into different trays by category.", level: "simple", label: "⭐ 简单" },
                    { task: "分类：Sort \"tableware\", \"cup\", \"fruit\" and \"remote\" into corresponding trays by category.", level: "moderate", label: "⭐⭐ 中等" },
                    { task: "分类：Sort \"tableware\", \"book\", \"toiletry\" and \"cup\" into corresponding trays and cabinets by category.", level: "complex", label: "⭐⭐⭐ 复杂" },
                    { task: "分类：Sort \"cup\", \"tableware\", \"book\", \"toiletry\", \"fruit\" and \"remote\" into designated storage locations by category.", level: "very_complex", label: "⭐⭐⭐⭐ 极复杂" }
                ]
            },
            make_sandwich: {
                name: '🥪 堆叠任务',
                description: '顺序堆叠：按顺序堆叠食材（从下到上）',
                details: '评估多机器人在顺序堆叠任务上的协作能力。系统中包含固定机械臂和移动机器人，通过四阶段模型实现自主任务分配与协调。',
                color: '#ff6b9d',
                tasks: [
                    { task: "制作三明治：Stack \"bread\" and \"cheese\" onto the tray in order.", level: "simple", label: "⭐ 简单" },
                    { task: "制作三明治：Stack \"bread\", \"lettuce\" and \"cheese\" into sandwich on the countertop.", level: "moderate", label: "⭐⭐ 中等" },
                    { task: "制作三明治：Stack \"bread\", \"lettuce\", \"tomato\", \"patty\" and \"cheese\" into hamburger on the countertop.", level: "complex", label: "⭐⭐⭐ 复杂" },
                    { task: "制作三明治：Build multi-layer sandwich tower with \"bread\", \"lettuce\", \"tomato\", \"patty\", \"cheese\", \"egg\" and \"cucumber\".", level: "very_complex", label: "⭐⭐⭐⭐ 极复杂" }
                ]
            }
        };
        
        // 创建示例任务弹窗
        function createExampleModal() {
            const modal = document.createElement('div');
            modal.className = 'example-modal';
            modal.id = 'example-modal';
            
            let html = `
                <div class="example-modal-content">
                    <div class="example-modal-header">
                        <h3 class="example-modal-title">📋 示例任务</h3>
                        <button class="example-modal-close" id="example-modal-close">×</button>
                    </div>
            `;
            
            Object.entries(taskExamples).forEach(([key, category]) => {
                html += `
                    <div class="example-category">
                        <div class="example-category-title" style="color: ${category.color}; border-color: ${category.color}40;">
                            ${category.name} - ${category.description}
                        </div>
                        <div class="example-category-details" style="color: #8b8b9a; font-size: 0.85em; margin: 8px 0 12px 0; line-height: 1.5;">
                            ${category.details}
                        </div>
                `;
                
                category.tasks.forEach(item => {
                    const badgeClass = `badge-${item.level}`;
                    const taskType = key === 'pack_object' ? '📦' : key === 'sort_solid' ? '🎨' : '🥪';
                    // 对任务中的双引号进行HTML转义，避免破坏data-task属性
                    const escapedTask = item.task.replace(/"/g, '&quot;');
                    html += `
                        <div class="example-task-item" data-task="${escapedTask}" data-type="${key}">
                            ${taskType} ${item.task}
                            <span class="complexity-badge ${badgeClass}">${item.label}</span>
                        </div>
                    `;
                });
                
                html += `</div>`;
            });
            
            html += `</div></div>`;
            modal.innerHTML = html;
            document.body.appendChild(modal);
            
            // 关闭按钮事件
            document.getElementById('example-modal-close').addEventListener('click', () => {
                modal.classList.remove('active');
            });
            
            // 点击外部关闭
            modal.addEventListener('click', (e) => {
                if (e.target === modal) {
                    modal.classList.remove('active');
                }
            });
            
            // 点击任务项
            modal.querySelectorAll('.example-task-item').forEach(item => {
                item.addEventListener('click', () => {
                    const task = item.getAttribute('data-task');
                    elements.chatInput.value = task;
                    modal.classList.remove('active');
                    // 自动分析
                    analyzeTask(task);
                });
            });
        }
        
        // 初始化示例任务弹窗
        createExampleModal();
        
        // 示例任务按钮事件
        document.getElementById('example-tasks-btn').addEventListener('click', () => {
            document.getElementById('example-modal').classList.add('active');
        });
        
        // 通知函数
        function showNotification(message, type = 'info') {
            const notification = document.createElement('div');
            notification.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                padding: 12px 20px;
                border-radius: 8px;
                background: ${type === 'warning' ? 'rgba(251, 191, 36, 0.9)' : 'rgba(78, 205, 196, 0.9)'};
                color: #000;
                font-weight: 500;
                z-index: 10000;
                animation: slideIn 0.3s ease;
            `;
            notification.textContent = message;
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.style.animation = 'slideOut 0.3s ease';
                setTimeout(() => notification.remove(), 300);
            }, 3000);
        }
        
        // 添加动画样式
        const style = document.createElement('style');
        style.textContent = `
            @keyframes slideIn {
                from { transform: translateX(100%); opacity: 0; }
                to { transform: translateX(0); opacity: 1; }
            }
            @keyframes slideOut {
                from { transform: translateX(0); opacity: 1; }
                to { transform: translateX(100%); opacity: 0; }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
